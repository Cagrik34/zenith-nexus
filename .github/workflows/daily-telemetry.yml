name: Automated Daily Health & Bundle Telemetry

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Collect Telemetry & Bundle Metrics
        run: node scripts/telemetry-collector.js

      - name: Commit & Push Daily Telemetry
        run: |
          git config user.name "Çağrı Giray Keşan"
          git config user.email "cagrigiraykesan@gmail.com"
          git add telemetry/
          if git diff --staged --quiet; then
            echo "No telemetry changes detected."
          else
            git commit -m "chore(telemetry): record automated build health & vitest metrics [skip ci]"
            git push origin main
          fi
